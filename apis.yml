apis:
- aid: travis-ci:v3
  name: Travis CI REST API v3
  description: >-
    Current REST API used by the Travis CI web UI. 50+ resource types covering builds, jobs, repositories,
    users, organizations, crons, caches, environment variables, requests and config validation. Hypermedia,
    eager/partial loading and pagination supported. Token-based auth obtained via GitHub OAuth.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.travis-ci.com/
